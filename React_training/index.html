<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Registration Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="form-container">
    <h2 class="text-center text-success mb-4">
        Bank Account Registration
    </h2>

    <form id="bankForm">

        <!-- First Name -->
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" id="firstName" class="form-control">
            <span id="firstNameError" class="error"></span>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" id="lastName" class="form-control">
            <span id="lastNameError" class="error"></span>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" id="email" class="form-control">
            <span id="emailError" class="error"></span>
        </div>

    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Email address</label>
    </div>

    <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
        <label for="floatingPassword">Password</label>
    </div>

        <!-- DOB -->
        <div class="mb-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" id="dob" class="form-control">
            <span id="dobError" class="error"></span>
        </div>

        <!-- Phone -->
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" id="phone" class="form-control">
            <span id="phoneError" class="error"></span>
        </div>

        <!-- Gender -->
        <div class="mb-3">
            <label class="form-label d-block">Gender</label>

            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female" class="ms-3"> Female
            <input type="radio" name="gender" value="Other" class="ms-3"> Other

            <br>
            <span id="genderError" class="error"></span>
        </div>

        <!-- PAN -->
        <div class="mb-3">
            <label class="form-label">PAN Number</label>
            <input type="text" id="pan" class="form-control">
            <span id="panError" class="error"></span>
        </div>

        <button type="submit" class="btn btn-success w-100">
            Submit
        </button>

    </form>
</div>

<script src="index.js"></script>

</body>
</html>
